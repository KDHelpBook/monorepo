# khb — Rust workspace (KD Help Book) (the data engine)
#
# `core` is the native data engine used by `cli`. The `wasm` crate is reserved
# for possible future integration; the browser uses wa-sqlite directly.
[workspace]
resolver = "2"
members = ["core", "cli", "wasm"]

[workspace.package]
version = "0.0.4"
edition = "2021"
license = "MIT"
authors = ["Krystian Duma"]
repository = "https://github.com/KDHelpBook/monorepo"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
