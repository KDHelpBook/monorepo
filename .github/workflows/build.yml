name: Build

# Builds everything publishable: prebuilt `khb` CLI binaries for the
# popular platforms, the viewer dist, and the documentation volumes
# (docs/*/docset.toml) compiled to .khb. Runs standalone on push / PR / manual
# dispatch; when called by release.yml (release_tag set) it builds from the
# tag and uploads the binaries + docs .khb as release assets. publish.yml
# never builds — it consumes this workflow's artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag (vX.Y.Z) to build from and upload assets to
        type: string
        default: ""

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p khb-cli --target ${{ matrix.target }}
        working-directory: compiler

      - name: Smoke-test the built CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="compiler/target/${{ matrix.target }}/release/khb"
          OUT="${RUNNER_TEMP}/smoke.khb"
          "$BIN" --version
          "$BIN" compile compiler/examples/en -o "$OUT"
          "$BIN" inspect "$OUT" --json | tee "${RUNNER_TEMP}/inspect.json"
          grep -q '"id": "khb-docs-en"' "${RUNNER_TEMP}/inspect.json"

      - name: Smoke-test the built CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "compiler/target/${{ matrix.target }}/release/khb.exe"
          $out = Join-Path $env:RUNNER_TEMP "smoke.khb"
          & $bin --version
          & $bin compile compiler/examples/en -o $out
          & $bin inspect $out --json | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "inspect.json")
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed" }
          if (-not (Select-String -Path (Join-Path $env:RUNNER_TEMP "inspect.json") -Pattern '"id": "khb-docs-en"' -Quiet)) {
            throw "inspect JSON did not contain the expected docset id"
          }

      - name: Enforce the glibc 2.35 ceiling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BIN="compiler/target/${{ matrix.target }}/release/khb"
          MAX_GLIBC="$(
            readelf --version-info "$BIN" \
              | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' \
              | sort -V \
              | tail -n1
          )"
          [[ -n "$MAX_GLIBC" ]]
          if [[ "$(printf '%s\n' "$MAX_GLIBC" "2.35" | sort -V | tail -n1)" != "2.35" ]]; then
            echo "Binary requires GLIBC_$MAX_GLIBC; maximum supported is GLIBC_2.35" >&2
            exit 1
          fi
          echo "Maximum required glibc symbol: GLIBC_$MAX_GLIBC"

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' compiler/Cargo.toml | head -n1)
          NAME="khb-v${VERSION}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "compiler/target/${{ matrix.target }}/release/khb" README.md LICENSE "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path compiler/Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          $name = "khb-v$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "compiler/target/${{ matrix.target }}/release/khb.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: khb-${{ matrix.target }}
          path: |
            khb-v*-${{ matrix.target }}.tar.gz
            khb-v*-${{ matrix.target }}.zip
          if-no-files-found: error

  viewer:
    name: Viewer (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer-ts/package-lock.json

      - name: Build the viewer
        run: |
          npm ci
          npm run build
        working-directory: viewer-ts

      - uses: actions/upload-artifact@v7
        with:
          name: viewer-dist
          path: viewer-ts/dist
          if-no-files-found: error

  registry-package:
    name: Registry (npm package)
    needs: viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: registry/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: viewer-dist
          path: viewer-dist

      - name: Build and pack the registry
        working-directory: registry
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run stage-viewer -- --viewer ../viewer-dist
          mkdir -p ../registry-package
          npm pack --pack-destination ../registry-package

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          tar tzf registry-package/*.tgz | grep -q 'package/dist/index.js'
          tar tzf registry-package/*.tgz | grep -q 'package/schema/khb-registry.schema.json'
          tar tzf registry-package/*.tgz | grep -q 'package/viewer/index.html'
          TARBALL="$(find registry-package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          node registry/scripts/smoke-package.mjs "$TARBALL"

      - uses: actions/upload-artifact@v7
        with:
          name: cf-registry-package
          path: registry-package/*.tgz
          if-no-files-found: error

  docs:
    name: Docs (.khb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: Build the CLI
        run: cargo build --release -p khb-cli
        working-directory: compiler

      # Every docs/*/ directory with a docset.toml is a documentation volume
      # (authoring, publishing, internals, …) — compile them all.
      - name: Compile the documentation volumes
        shell: bash
        run: |
          BIN=compiler/target/release/khb
          mkdir -p out
          TAG="${{ inputs.release_tag }}"
          for T in docs/*/docset.toml; do
            DIR=$(dirname "$T")
            ID=$(sed -n 's/^id = "\(.*\)"$/\1/p' "$T" | head -n1)
            if [[ -n "$TAG" ]]; then
              VER="${TAG#v}"
              # Suffix the docset id with the version (build-time only, never
              # committed): archived books need unique ids to coexist with the
              # current one in the viewer's version switcher (sample-sdk pattern).
              sed -i "s/^id = \"${ID}\"$/id = \"${ID}-v${VER}\"/" "$T"
              grep -q "^id = \"${ID}-v${VER}\"$" "$T"
              "$BIN" compile "$DIR" -o "out/${ID}-v${VER}.khb" --allow-extensions
            else
              "$BIN" compile "$DIR" -o "out/${ID}.khb" --allow-extensions
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: docs-khb
          path: out/*.khb
          if-no-files-found: error

  browser-smoke:
    name: Packed distribution (browser smoke)
    needs: [cli, viewer, docs]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer-ts/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: khb-x86_64-unknown-linux-gnu
          path: cli
      - uses: actions/download-artifact@v8
        with:
          name: viewer-dist
          path: viewer-dist
      - uses: actions/download-artifact@v8
        with:
          name: docs-khb
          path: docs-khb
      - name: Assemble a four-volume distribution
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf cli/*.tar.gz -C cli
          BIN="$(find cli -type f -name khb -perm -111 -print -quit)"
          mapfile -t DOCSETS < <(find docs-khb -maxdepth 1 -type f -name '*.khb' | LC_ALL=C sort)
          [[ "${#DOCSETS[@]}" -eq 4 ]]
          ARGS=()
          for DOCSET in "${DOCSETS[@]}"; do
            ARGS+=(--docset "$DOCSET")
          done
          "$BIN" pack \
            --viewer viewer-dist \
            "${ARGS[@]}" \
            --out smoke-dist \
            --home search \
            --stream
      - name: Run the browser smoke test
        working-directory: viewer-ts
        env:
          KHB_SMOKE_URL: http://127.0.0.1:4173
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory ../smoke-dist &
          npm run test:release-smoke

  release-assets:
    name: Upload release assets
    if: inputs.release_tag != ''
    needs: [cli, viewer, docs, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: khb-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: docs-khb
          path: assets
      # The viewer dist ships as its own versioned archive: `khb pack`
      # needs a built viewer, so a downloaded CLI alone couldn't assemble a
      # distribution without it.
      - uses: actions/download-artifact@v8
        with:
          name: viewer-dist
          path: viewer-dist
      - name: Package the viewer
        run: |
          NAME="khb-viewer-${{ inputs.release_tag }}"
          mv viewer-dist "$NAME"
          tar czf "assets/${NAME}.tar.gz" "$NAME"
      # Generate this only after every release asset has its final name. Sorting
      # bytewise makes the manifest stable regardless of filesystem ordering.
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          [[ "$(wc -l < SHA256SUMS)" -eq 10 ]]
          sha256sum --check SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" assets/* --clobber -R "${{ github.repository }}"
