name: Release

# Bumps the version everywhere it lives, commits + tags on main, creates the
# GitHub release, then chains build.yml (binaries + docs .khb as release
# assets) and publish.yml (GitHub Pages). The chain uses workflow_call because
# a push/tag made with GITHUB_TOKEN does not trigger other workflows.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version (X.Y.Z) — overrides bump
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release

jobs:
  tag:
    name: Bump, commit, tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - name: Compute the new version
        id: version
        shell: bash
        run: |
          CUR=$(sed -n 's/^version = "\(.*\)"$/\1/p' compiler/Cargo.toml | head -n1)
          NEW="${{ inputs.version }}"
          NEW="${NEW#v}"
          if [[ -z "$NEW" ]]; then
            IFS=. read -r MAJ MIN PAT <<<"$CUR"
            case "${{ inputs.bump }}" in
              major) NEW="$((MAJ + 1)).0.0" ;;
              minor) NEW="${MAJ}.$((MIN + 1)).0" ;;
              patch) NEW="${MAJ}.${MIN}.$((PAT + 1))" ;;
            esac
          fi
          [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: '$NEW'" >&2; exit 1; }
          [[ "$NEW" != "$CUR" ]] || { echo "version $NEW is already current" >&2; exit 1; }
          echo "bump: $CUR -> $NEW"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Set the version in code
        shell: bash
        run: |
          NEW="${{ steps.version.outputs.new }}"
          # Workspace version — the single source; every crate inherits it.
          sed -i "0,/^version = \".*\"$/s//version = \"${NEW}\"/" compiler/Cargo.toml
          grep -q "^version = \"${NEW}\"$" compiler/Cargo.toml
          (cd compiler && cargo update --workspace)
          (cd viewer-ts && npm version "$NEW" --no-git-tag-version)
          (cd registry && npm version "$NEW" --no-git-tag-version)
          # Every published documentation volume (docs/*/docset.toml); the
          # compiler/examples/* fixtures keep their static demo versions.
          for T in docs/*/docset.toml; do
            sed -i "s/^version = \".*\"$/version = \"${NEW}\"/" "$T"
            grep -q "^version = \"${NEW}\"$" "$T"
          done
          git diff --stat

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:main --follow-tags

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" --generate-notes \
            -R "${{ github.repository }}"

      # Move the major-version alias tag (e.g. v1) to this release. It's how
      # downstream repositories pin the reusable workflows and composite actions
      # (`uses: KDHelpBook/monorepo/.github/workflows/book-pages.yml@v1`, which
      # in turn reference setup-khb@v1 / build-book@v1) — the actions/checkout@v4
      # convention: one moving major that always resolves to the newest release
      # in that series. Force-updated on every release; exact `@vX.Y.Z` pins stay
      # available for anyone wanting to lock a specific version.
      - name: Move the major-version alias tag
        run: |
          NEW="${{ steps.version.outputs.new }}"
          MAJOR="v${NEW%%.*}"
          git tag -f "$MAJOR"
          git push origin "refs/tags/$MAJOR" --force

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit

  publish:
    needs: [tag, build]
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    # The cross-repo Pages deploy authenticates with the PAGES_DEPLOY_KEY
    # secret (via `secrets: inherit`), not with workflow permissions.
    permissions:
      contents: read
      actions: read
    secrets: inherit

  registry-package:
    name: Publish @kdhelpbook/cf-registry
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cf-registry-package
          path: package
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish with npm trusted publishing
        run: npm publish package/*.tgz

  registry-docs:
    name: Publish ${{ matrix.id }} to the official registry
    if: vars.KHB_REGISTRY_URL != ''
    needs: [tag, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: khb-authoring
            source: docs/authoring
            allow-extensions: true
          - id: khb-publishing
            source: docs/publishing
            allow-extensions: false
          - id: khb-registry
            source: docs/registry
            allow-extensions: false
    uses: ./.github/workflows/publish-registry.yml
    with:
      registry-url: ${{ vars.KHB_REGISTRY_URL }}
      source: ${{ matrix.source }}
      ref: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.tag }}
      allow-extensions: ${{ matrix.allow-extensions }}
    permissions:
      contents: read
      id-token: write
